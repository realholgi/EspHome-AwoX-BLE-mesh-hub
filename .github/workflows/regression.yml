name: ESPHome AwoX regression and firmware build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Python 3.13 / native protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python source-regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build and run native C++ protocol tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. tests/test_protocol_safety.cpp -o /tmp/awox_protocol_tests
          /tmp/awox_protocol_tests

  firmware:
    name: ESPHome 2026.10.2 / ESP-IDF compile
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ESPHome
        run: python -m pip install "esphome==2026.10.2"
      - name: Prepare local component and dummy credentials
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("awox-ble-mesh-hub.yaml").read_text()
          upstream = ("  - source:\n"
                      "      type: git\n"
                      "      url: https://github.com/fsaris/EspHome-AwoX-BLE-mesh-hub\n"
                      "      ref: main\n")
          local = ("  - source:\n"
                   "      type: local\n"
                   "      path: components\n")
          assert src.count(upstream) == 1, "Expected upstream component source exactly once"
          Path("ci-awox.yaml").write_text(src.replace(upstream, local))
          Path("secrets.yaml").write_text(
              'mqtt_host: "127.0.0.1"\n'
              'mqtt_user: "ci"\n'
              'mqtt_password: "ci-dummy"\n'
              'ota_password: "ci-dummy"\n'
              'wifi_ssid: "ci-dummy"\n'
              'wifi_password: "ci-dummy-password"\n'
              'mesh_name: "ci-mesh"\n'
              'mesh_password: "ci-mesh"\n'
          )
          PY
      - name: Validate configuration
        run: esphome config ci-awox.yaml
      - name: Compile real firmware
        run: esphome compile ci-awox.yaml
