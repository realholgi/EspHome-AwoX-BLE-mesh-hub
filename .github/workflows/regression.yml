name: ESPHome AwoX regression and firmware build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Python 3.13 / native protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python source-regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build and run native C++ protocol tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. tests/test_protocol_safety.cpp -o /tmp/awox_protocol_tests
          /tmp/awox_protocol_tests

  firmware:
    name: ESPHome 2026.10.2 / ESP-IDF compile
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ESPHome
        run: python -m pip install "esphome==2026.10.2"
      - name: Prepare local component and dummy credentials
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("awox-ble-mesh-hub.yaml").read_text()
          upstream = ("  - source:\n"
                      "      type: git\n"
                      "      url: https://github.com/fsaris/EspHome-AwoX-BLE-mesh-hub\n"
                      "      ref: main\n")
          local = ("  - source:\n"
                   "      type: local\n"
                   "      path: components\n")
          assert src.count(upstream) == 1, "Expected upstream component source exactly once"
          Path("ci-awox.yaml").write_text(src.replace(upstream, local))

          # Compile the M5StickC Plus display example against the checked-out
          # AwoX code, not a moving GitHub branch. AXP192 remains the user fork.
          display = Path("sample-config/m5stickcplus-gateway-display.yaml").read_text()
          display_upstream = (
              "  - source:\\n"
              "      type: git\\n"
              "      url: https://github.com/realholgi/EspHome-AwoX-BLE-mesh-hub\\n"
              "      ref: main\\n"
              "    components: [awox_mesh]\\n"
              "    refresh: 1d\\n"
          )
          display_local = (
              "  - source:\\n"
              "      type: local\\n"
              "      path: components\\n"
              "    components: [awox_mesh]\\n"
          )
          display_upstream = display_upstream.replace("\\\\n", "\\n")
          display_local = display_local.replace("\\\\n", "\\n")
          assert display.count(display_upstream) == 1, "Expected display fork reference exactly once"
          Path("ci-m5stick-display.yaml").write_text(display.replace(display_upstream, display_local))
          Path("secrets.yaml").write_text(
              'mqtt_host: "127.0.0.1"\n'
              'mqtt_user: "ci"\n'
              'mqtt_password: "ci-dummy"\n'
              'ota_password: "ci-dummy"\n'
              'wifi_ssid: "ci-dummy"\n'
              'wifi_password: "ci-dummy-password"\n'
              'mesh_name: "ci-mesh"\n'
              'mesh_password: "ci-mesh"\n'
          )
          PY
      - name: Validate configuration
        run: esphome config ci-awox.yaml
      - name: Compile real firmware
        run: esphome compile ci-awox.yaml
      - name: Validate M5StickC Plus display configuration
        run: esphome config ci-m5stick-display.yaml
      - name: Compile M5StickC Plus display firmware
        run: esphome compile ci-m5stick-display.yaml
